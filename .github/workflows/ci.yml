name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: build
        run: go build ./...
      - name: test (race)
        run: go test -race ./...

  # Dogfooding: the guardrails the tool ships must actually hold. If the default
  # policy ever stops denying these, the build fails — the tool gates itself.
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go build -o agentguard .
      - name: destructive prod actions must be denied
        run: |
          ! ./agentguard policy test --tool shell --target "kubectl delete namespace payments" --context prod
          ! ./agentguard policy test --target "terraform destroy" --context prod
          ! ./agentguard policy test --target "rm -rf /data" --context dev
      - name: read-only actions must be allowed
        run: |
          ./agentguard policy test --tool kubectl --target "kubectl get pods" --context prod
      - name: the proxy enforces the same decisions over MCP
        run: |
          python3 - <<'PY'
          import json, subprocess
          p = subprocess.Popen(["./agentguard","proxy"], stdin=subprocess.PIPE,
                               stdout=subprocess.PIPE, text=True)
          def send(o): p.stdin.write(json.dumps(o)+"\n"); p.stdin.flush()
          def recv():
              while True:
                  l = p.stdout.readline()
                  if not l: raise SystemExit("proxy closed early")
                  l = l.strip()
                  if l: return json.loads(l)
          send({"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}); recv()
          send({"jsonrpc":"2.0","method":"notifications/initialized"})
          def decision(tool,target,ctx):
              send({"jsonrpc":"2.0","id":9,"method":"tools/call","params":{"name":"guard","arguments":{"tool":tool,"target":target,"context":ctx}}})
              return recv()["result"]["structuredContent"]["decision"]
          assert decision("shell","kubectl delete namespace payments","prod")=="deny", "prod delete must deny"
          assert decision("kubectl","kubectl get pods","prod")=="allow", "get pods must allow"
          p.stdin.close(); p.wait(timeout=5)
          print("proxy enforcement OK")
          PY
      - name: scan flags an unpinned MCP server and passes a clean one
        run: |
          echo '{"mcpServers":{"bad":{"command":"npx","args":["-y","srv"]}}}' > risky.json
          echo '{"mcpServers":{"ok":{"command":"npx","args":["-y","srv@1.2.3"]}}}' > clean.json
          ! ./agentguard scan risky.json   # HIGH finding → non-zero, negated → step passes
          ./agentguard scan clean.json      # no finding → zero
